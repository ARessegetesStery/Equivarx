[package]
name = "eqx_window"
version = "0.1.0"
edition = "2021"

[dependencies]
eqx_utils = { path = "../eqx_utils", version = "0.1.0" }

anyhow = "1.0"
bytemuck = { version = "1.22", features = ["derive"] }
glam = "0.30"
eqx_app = { path = "../eqx_app", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
pollster = "0.2"
winit = { version = "0.29", features = ["rwh_05"] }
wgpu = "26.0"
